create_fabric_deployment_pipeline:
  extends: .fabric_windows_job
  stage: provision
  timeout: 10m
  resource_group: fabric-deployment-pipeline-create
  environment:
    name: dev
  rules:
    - if: '$FABRIC_OPERATION == "CreatePipeline"'
    - when: never
  script:
    - |
      if ($env:DRY_RUN -notin @("true", "false")) {
        throw "DRY_RUN must be true or false"
      }
      $Parameters = @{
        DisplayName = $env:PIPELINE_NAME
        Description = $env:PIPELINE_DESCRIPTION
        StageNames = @(
          $(if ($env:FABRIC_DEV_STAGE_NAME) { $env:FABRIC_DEV_STAGE_NAME } else { "Development" })
          $(if ($env:FABRIC_TEST_STAGE_NAME) { $env:FABRIC_TEST_STAGE_NAME } else { "Test" })
          $(if ($env:FABRIC_PROD_STAGE_NAME) { $env:FABRIC_PROD_STAGE_NAME } else { "Production" })
        )
        WorkspaceNames = @(
          [string]$env:DEV_WORKSPACE_NAME
          [string]$env:TEST_WORKSPACE_NAME
          [string]$env:PROD_WORKSPACE_NAME
        )
        PipelineAdminGroup = [string]$env:PIPELINE_ADMIN_GROUP
        ConfiguredPipelineAdminGroupName = [string]$env:FABRIC_PIPELINE_ADMIN_GROUP_NAME
        ConfiguredPipelineAdminGroupId = [string]$env:FABRIC_PIPELINE_ADMIN_GROUP_ID
        DryRun = $env:DRY_RUN -eq "true"
      }
      $ResultJson = (& ./scripts/New-FabricDeploymentPipeline.ps1 @Parameters | Out-String).Trim()
      if ($LASTEXITCODE) { exit $LASTEXITCODE }
      $Result = $ResultJson | ConvertFrom-Json -ErrorAction Stop
      @(
        "FABRIC_PROVISIONED_PIPELINE_ID=$($Result.PipelineId)"
        "FABRIC_PROVISIONED_PIPELINE_NAME=$($Result.DisplayName)"
      ) | Set-Content -LiteralPath fabric-pipeline.env -Encoding ascii
      $ResultJson | Set-Content -LiteralPath fabric-pipeline-result.json -Encoding utf8
      $ResultJson
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - fabric-pipeline-result.json
    reports:
      dotenv: fabric-pipeline.env
