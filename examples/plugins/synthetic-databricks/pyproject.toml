[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "etl-target-databricks-example"
version = "0.1.0"
description = "Synthetic manual-review-only example of an ETL target provider"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["etl-migration-core>=1.0.0,<2"]

[project.entry-points."etl_migration.targets"]
synthetic-databricks = "etl_target_databricks_example:SyntheticDatabricksProvider"

[tool.hatch.build.targets.wheel]
packages = ["src/etl_target_databricks_example"]
