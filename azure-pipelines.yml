trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: windows-latest

steps:
  - checkout: self
    clean: true

  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.13"

  - powershell: |
      python -m pip install uv
      uv sync --extra dev --locked
      uv run ruff check src tests
      uv run mypy
      uv run pytest --cov-fail-under=80
    displayName: Validate Python

  - task: NodeTool@0
    inputs:
      versionSpec: "22.x"

  - powershell: |
      npm ci
      npm run lint
      npm test
      npm run build
    workingDirectory: apps/web
    displayName: Validate web application
