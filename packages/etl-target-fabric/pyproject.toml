[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "etl-target-fabric"
version = "1.0.0"
description = "Microsoft Fabric target provider: fit evaluator, F-SKU capacity model, Dataflow Gen2 / PySpark / Data Pipeline compilers, and artifact writer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "defusedxml>=0.7.1,<1",
  "etl-migration-core>=1.0.0,<2",
]
classifiers = [
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.entry-points."etl_migration.targets"]
fabric = "etl_target_fabric.provider:FabricTargetProvider"

[project.scripts]
etl-fabric = "etl_target_fabric.stdio:main"

[tool.hatch.build.targets.wheel]
packages = ["src/etl_target_fabric"]
