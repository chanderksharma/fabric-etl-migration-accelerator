[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "etl-portfolio-assessment"
version = "1.0.0"
description = "Target-neutral ETL portfolio assessment, complexity scoring, effort baseline, and redacted graph evidence"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "defusedxml>=0.7.1,<1",
  "etl-migration-core>=1.0.0,<2",
]
classifiers = [
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.optional-dependencies]
fabric = [
  "etl-target-fabric>=1.0.0,<2",
]

[project.scripts]
etl-assess = "etl_portfolio_assessment.service.stdio:main"

[tool.hatch.build.targets.wheel]
packages = ["src/etl_portfolio_assessment"]
